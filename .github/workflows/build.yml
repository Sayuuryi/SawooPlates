name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore: [ 'repo.json' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN: SawooPlates
  GIT_NAME: Joao Victor R
  GIT_EMAIL: sayurirhea@gmail.com

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test SawooPlates.Tests --configuration Release

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        run: dotnet build SawooPlates/SawooPlates.csproj --configuration Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SawooPlates
          path: SawooPlates/bin/Release/SawooPlates/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: SawooPlates
          path: dist

      - name: Check version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content dist/SawooPlates.json -Raw | ConvertFrom-Json
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          if ($manifest.AssemblyVersion -ne $tag) {
            throw "Tag $tag does not match AssemblyVersion $($manifest.AssemblyVersion) in the csproj"
          }
          "version=$tag" >> $env:GITHUB_OUTPUT

      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]" | Select-Object -First 1).LineNumber
          if (-not $start) { throw "No CHANGELOG entry for $version" }
          $body = @()
          foreach ($line in $lines[$start..($lines.Count - 1)]) {
            if ($line -match '^## ') { break }
            $body += $line
          }
          ($body -join "`n").Trim() | Set-Content -Encoding utf8 notes.md

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' dist/latest.zip dist/SawooPlates.json `
            --title "Sawoo Plates ${{ steps.version.outputs.version }}" `
            --notes-file notes.md

      - name: Update repo.json
        shell: pwsh
        run: |
          $manifest = Get-Content dist/SawooPlates.json -Raw | ConvertFrom-Json -AsHashtable
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/latest.zip"
          $manifest['DownloadLinkInstall'] = $url
          $manifest['DownloadLinkUpdate'] = $url
          $manifest['DownloadLinkTesting'] = $url
          $manifest['LastUpdate'] = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $manifest['Changelog'] = (Get-Content notes.md -Raw).Trim()
          ConvertTo-Json @($manifest) -Depth 5 | Set-Content -Encoding utf8 repo.json

          git config user.name  "$env:GIT_NAME"
          git config user.email "$env:GIT_EMAIL"
          git add repo.json
          git commit -m "Update repo.json for ${{ steps.version.outputs.version }}"
          git push origin main
