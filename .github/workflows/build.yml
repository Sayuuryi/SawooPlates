name: Build

# Releases:
#   tag vX.Y.Z.W-testing  -> testing version (only for people with "Receive plugin testing versions" on)
#   tag vX.Y.Z.W          -> stable version for everyone
# Tag the same commit with the stable tag once the testing version is good.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore: [ 'repo.json' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN: SawooPlates
  GIT_NAME: Joao Victor R
  GIT_EMAIL: sayurirhea@gmail.com

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test SawooPlates.Tests --configuration Release

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        run: dotnet build SawooPlates/SawooPlates.csproj --configuration Release

      - name: Check services
        run: dotnet run --project SawooPlates.ServiceCheck --configuration Release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SawooPlates
          path: SawooPlates/bin/Release/SawooPlates/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: SawooPlates
          path: dist

      - name: Check version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content dist/SawooPlates.json -Raw | ConvertFrom-Json
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $testing = $tag.EndsWith('-testing')
          $version = $tag -replace '-testing$', ''
          if ($manifest.AssemblyVersion -ne $version) {
            throw "Tag $tag does not match AssemblyVersion $($manifest.AssemblyVersion) in the csproj"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "testing=$($testing.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]" | Select-Object -First 1).LineNumber
          if (-not $start) { throw "No CHANGELOG entry for $version" }
          $body = @()
          foreach ($line in $lines[$start..($lines.Count - 1)]) {
            if ($line -match '^## ') { break }
            $body += $line
          }
          ($body -join "`n").Trim() | Set-Content -Encoding utf8 notes.md

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $title = "Sawoo Plates ${{ steps.version.outputs.version }}"
          $flags = @()
          if ('${{ steps.version.outputs.testing }}' -eq 'true') { $title += " (testing)"; $flags += '--prerelease' }
          gh release create '${{ github.ref_name }}' dist/latest.zip dist/SawooPlates.json --title $title --notes-file notes.md @flags

      - name: Update repo.json
        shell: pwsh
        run: |
          $manifest = Get-Content dist/SawooPlates.json -Raw | ConvertFrom-Json -AsHashtable
          $testing = '${{ steps.version.outputs.testing }}' -eq 'true'
          $version = '${{ steps.version.outputs.version }}'
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/latest.zip"

          # keep entries of other plugins; replace or create ours
          $entries = @()
          if (Test-Path repo.json) { $entries = @(Get-Content repo.json -Raw | ConvertFrom-Json -AsHashtable) }
          $entry = $entries | Where-Object { $_['InternalName'] -eq $manifest['InternalName'] } | Select-Object -First 1
          $others = @($entries | Where-Object { $_['InternalName'] -ne $manifest['InternalName'] })

          if ($testing) {
            if ($null -eq $entry) {
              # first release ever is a testing one: list it, but only testing users can install it
              $entry = $manifest
              $entry['IsTestingExclusive'] = $true
              $entry['DownloadLinkInstall'] = $url
              $entry['DownloadLinkUpdate'] = $url
            }
            $entry['TestingAssemblyVersion'] = $version
            $entry['TestingDalamudApiLevel'] = $manifest['DalamudApiLevel']
            $entry['DownloadLinkTesting'] = $url
          }
          else {
            $testingVersion = if ($entry) { $entry['TestingAssemblyVersion'] } else { $null }
            $testingUrl = if ($entry) { $entry['DownloadLinkTesting'] } else { $null }
            $entry = $manifest
            $entry['DownloadLinkInstall'] = $url
            $entry['DownloadLinkUpdate'] = $url
            # testing users get the stable build unless a newer testing build exists
            if ($testingVersion -and ([version]$testingVersion -gt [version]$version)) {
              $entry['TestingAssemblyVersion'] = $testingVersion
              $entry['DownloadLinkTesting'] = $testingUrl
            } else {
              $entry['TestingAssemblyVersion'] = $version
              $entry['DownloadLinkTesting'] = $url
            }
            $entry['TestingDalamudApiLevel'] = $manifest['DalamudApiLevel']
            $entry.Remove('IsTestingExclusive')
            $entry['Changelog'] = (Get-Content notes.md -Raw).Trim()
          }
          $entry['LastUpdate'] = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()

          ConvertTo-Json @($others + $entry) -Depth 5 | Set-Content -Encoding utf8 repo.json

          git config user.name  "$env:GIT_NAME"
          git config user.email "$env:GIT_EMAIL"
          git add repo.json
          $label = if ($testing) { "$version testing" } else { $version }
          git commit -m "Update repo.json for $label"
          git push origin main
