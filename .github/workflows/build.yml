name: Build

# Releases (Sawoo Plates, built here):
#   tag vX.Y.Z.W-testing  -> testing version (only for people with "Receive plugin testing versions" on)
#   tag vX.Y.Z.W          -> stable version for everyone
# Releases of prebuilt plugins in plugins/<InternalName>/:
#   tag <InternalName>-vX.Y.Z.W[-testing]
# Tag the same commit with the stable tag once the testing version is good.

on:
  push:
    branches: [ main ]
    tags: [ 'v*', '*-v*' ]
    paths-ignore: [ 'repo.json' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN: SawooPlates
  GIT_NAME: Joao Victor R
  GIT_EMAIL: sayurirhea@gmail.com

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') || startsWith(github.ref_name, 'v') }}
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test SawooPlates.Tests --configuration Release

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        run: dotnet build SawooPlates/SawooPlates.csproj --configuration Release

      - name: Check services
        run: dotnet run --project SawooPlates.ServiceCheck --configuration Release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SawooPlates
          path: SawooPlates/bin/Release/SawooPlates/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: SawooPlates
          path: dist

      - name: Check version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content dist/SawooPlates.json -Raw | ConvertFrom-Json
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $testing = $tag.EndsWith('-testing')
          $version = $tag -replace '-testing$', ''
          if ($manifest.AssemblyVersion -ne $version) {
            throw "Tag $tag does not match AssemblyVersion $($manifest.AssemblyVersion) in the csproj"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "testing=$($testing.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]" | Select-Object -First 1).LineNumber
          if (-not $start) { throw "No CHANGELOG entry for $version" }
          $body = @()
          foreach ($line in $lines[$start..($lines.Count - 1)]) {
            if ($line -match '^## ') { break }
            $body += $line
          }
          ($body -join "`n").Trim() | Set-Content -Encoding utf8 notes.md

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $title = "Sawoo Plates ${{ steps.version.outputs.version }}"
          $flags = @()
          if ('${{ steps.version.outputs.testing }}' -eq 'true') { $title += " (testing)"; $flags += '--prerelease' }
          gh release create '${{ github.ref_name }}' dist/latest.zip dist/SawooPlates.json --title $title --notes-file notes.md @flags

      - name: Update repo.json
        shell: pwsh
        run: |
          $testing = '${{ steps.version.outputs.testing }}' -eq 'true'
          $version = '${{ steps.version.outputs.version }}'
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/latest.zip"
          ./.github/scripts/Update-RepoJson.ps1 -ManifestPath dist/SawooPlates.json -DownloadUrl $url -Version $version -Testing $testing -NotesPath notes.md

          git config user.name  "$env:GIT_NAME"
          git config user.email "$env:GIT_EMAIL"
          git add repo.json
          $label = if ($testing) { "Sawoo Plates $version testing" } else { "Sawoo Plates $version" }
          git commit -m "Update repo.json for $label"
          git push origin main

  release-prebuilt:
    if: ${{ startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref_name, 'v') }}
    runs-on: windows-2022
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Read tag
        id: tag
        shell: pwsh
        run: |
          if ('${{ github.ref_name }}' -notmatch '^(?<name>.+)-v(?<version>\d+(\.\d+){3})(?<testing>-testing)?$') { throw "Tag must look like Name-v1.2.3.4 or Name-v1.2.3.4-testing" }
          $name = $Matches['name']; $version = $Matches['version']; $testing = [bool]$Matches['testing']
          $dir = "plugins/$name"
          if (-not (Test-Path "$dir/$name.json")) { throw "No plugin folder $dir with $name.json" }
          $manifest = Get-Content "$dir/$name.json" -Raw | ConvertFrom-Json
          if ($manifest.AssemblyVersion -ne $version) { throw "Tag version $version does not match $name.json ($($manifest.AssemblyVersion))" }
          "name=$name" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "testing=$($testing.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "dir=$dir" >> $env:GITHUB_OUTPUT

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $files = Get-ChildItem '${{ steps.tag.outputs.dir }}' -File | Where-Object { $_.Name -ne 'icon.png' }
          Compress-Archive -Path $files.FullName -DestinationPath dist/latest.zip -Force
          Copy-Item '${{ steps.tag.outputs.dir }}/${{ steps.tag.outputs.name }}.json' dist/

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content 'dist/${{ steps.tag.outputs.name }}.json' -Raw | ConvertFrom-Json
          $title = "$($manifest.Name) ${{ steps.tag.outputs.version }}"
          $flags = @()
          if ('${{ steps.tag.outputs.testing }}' -eq 'true') { $title += " (testing)"; $flags += '--prerelease' }
          gh release create '${{ github.ref_name }}' dist/latest.zip 'dist/${{ steps.tag.outputs.name }}.json' --title $title --notes "$($manifest.Name) ${{ steps.tag.outputs.version }}" @flags

      - name: Update repo.json
        shell: pwsh
        run: |
          $testing = '${{ steps.tag.outputs.testing }}' -eq 'true'
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/latest.zip"
          ./.github/scripts/Update-RepoJson.ps1 -ManifestPath 'dist/${{ steps.tag.outputs.name }}.json' -DownloadUrl $url -Version '${{ steps.tag.outputs.version }}' -Testing $testing

          git config user.name  "$env:GIT_NAME"
          git config user.email "$env:GIT_EMAIL"
          git add repo.json
          git commit -m "Update repo.json for ${{ steps.tag.outputs.name }} ${{ github.ref_name }}"
          git push origin main
